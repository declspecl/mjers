[workspace]
resolver = "3"
members = ["mjers-core", "mjers-sim", "mjers-py", "mjers-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
mjers-core = { path = "mjers-core" }
mjers-sim = { path = "mjers-sim" }
anyhow = "1.0.104"
criterion = "0.8"
clap = { version = "4.6.6", features = ["derive"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Return errors instead of explicitly panicking; tests opt back in.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"

[package]
name = "mjers-cli"
description = "command-line interface for the mjers mahjong engine"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "mj"

[[bin]]
name = "mj"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
mjers-core.workspace = true
mjers-sim.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[profile.release]
debug = 1

# Keep hand analysis fast in dev and test builds by optimising the engine.
[profile.dev.package.mjers-core]
opt-level = 3
