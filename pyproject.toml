[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "mjers"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["msgspec>=0.19,<1", "numpy>=2,<3", "safetensors>=0.6,<1", "torch>=2.10,<3"]

[dependency-groups]
dev = ["maturin>=1.9.4,<2", "mypy>=1.19,<2", "ruff>=0.14,<1"]

[tool.maturin]
manifest-path = "mjers-py/Cargo.toml"
python-source = "python"
module-name = "mjers._native"

[tool.mypy]
files = ["python"]
mypy_path = "python"
python_version = "3.13"
strict = true
disallow_any_unimported = true
warn_unreachable = true

[tool.ruff]
src = ["python"]
target-version = "py313"
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN", "B"]

[tool.uv]
# Rebuild the native extension when its Rust inputs change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "mjers-core/Cargo.toml" },
    { file = "mjers-core/src/**/*.rs" },
    { file = "mjers-py/Cargo.toml" },
    { file = "mjers-py/src/**/*.rs" },
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
