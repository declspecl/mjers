[package]
name = "mjers-lambda"
description = "AWS Lambda HTTP and WebSocket runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mjers-core.workspace = true
mjers-table = { path = "../table" }
mjers-service = { path = "../service" }
mjers-dynamodb = { path = "../dynamodb" }
serde.workspace = true
serde_json.workspace = true
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-dynamodb = "1"
aws-sdk-apigatewaymanagement = "1"
lambda_runtime = "1"
base64 = "0.22"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
axum = "0.8"

[lints]
workspace = true
