name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.3.0
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo test --locked -p mjers-dynamodb --test local -- --ignored
      - run: cargo test --locked -p mjers-lambda --test gateway -- --ignored
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test backend/dev-server/tests/rooms.test.mjs
      - run: cargo build --locked -p mjers-core --target wasm32-unknown-unknown
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run --no-sync ruff check python
      - run: uv run --no-sync ruff format --check python
      - run: uv run --no-sync mypy
      - run: uv run --no-sync python -m unittest discover -s python/tests -v

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: npm/package-lock.json
      - run: cargo install wasm-bindgen-cli --version 0.2.125 --locked
      - run: npm ci --prefix npm
      - run: npm test --prefix npm
      - run: npm run test:package --prefix npm

  backend-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: backend/infra/package.json
      - run: backend/scripts/build-lambda.sh
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - run: node backend/scripts/check-lambda.mjs
      - run: pnpm --dir backend/infra install --frozen-lockfile
      - run: pnpm --dir backend/infra check-types
      - run: pnpm --dir backend/infra test
      - run: pnpm --dir backend/infra format:check
      - run: pnpm --dir backend/infra synth --quiet
        env:
          DEPLOYMENT_STAGE: dev
          SITE_ORIGIN: https://game.example
          BUDGET_EMAIL: offline-check@example.invalid
