name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked -p mjers-core --target wasm32-unknown-unknown
      - uses: astral-sh/setup-uv@v9
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run --no-sync ruff check python
      - run: uv run --no-sync ruff format --check python
      - run: uv run --no-sync mypy
      - run: uv run --no-sync python -m unittest discover -s python/tests -v
